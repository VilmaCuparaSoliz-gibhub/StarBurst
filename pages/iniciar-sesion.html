<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>iniciar sesion</title>

    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <div class="contenedor">

        <header class="titulo-superior">
            INGRESE SU IDENTIFICACION
        </header>

        <section class="banner">

            <h1>VS.I.A.F</h1>

            <p>
                Sistema de Activos Fijos
            </p>

        </section>

        <section class="login-box">

            <h2>Login</h2>

            <div class="fila">

                <label for="usuario">
                    Usuario:
                </label>

                <input 
                    type="text"
                    id="usuario"
                >

            </div>

            <div class="fila">

                <label for="password">
                    Contraseña:
                </label>

                <input 
                    type="password"
                    id="password"   
                >

            </div>

            <div class="parte-inferior">

                <span>
                    NOTA: Es sensible al contexto
                </span>

                <button id="btnLogin">
                    Aceptar
                </button>

            </div>

        </section>

        <footer class="footer">

            <p>VSIAF versión 2.0</p>

            <p>

            </p>

            <p>
                Todos los derechos reservados
            </p>

        </footer>

    </div>

    <script src="../assets/script/iniciar-sesion.js"></script>

</body>
</html>
